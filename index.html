        body {

        /* Custom Scrollbar */
        ::-webkit-scrollbar {

            height: 6px;
        }

            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #0D9488;
            border-radius: 4px;
        }
        
        /* Smooth transitions */
        .tab-transition {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }


        /* LifeBed responsive polish */
        *, *::before, *::after { box-sizing: border-box; }
        html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
        body { margin: 0; overflow-x: hidden; }
        button, input, select, textarea { font: inherit; }
        button { -webkit-tap-highlight-color: transparent; }
        #root, #root > div { min-width: 0; width: 100%; }
        main { min-width: 0; }
        canvas, svg, video, img { max-width: 100%; }
        canvas { display: block; }
        input, select, textarea { max-width: 100%; min-width: 0; }
        table { max-width: 100%; }
        .mobile-bottom-nav { display: none; }
        .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
        @media (max-width: 1023px) {
            header { position: sticky; top: 0; }
            header .max-w-7xl > .flex { gap: .5rem; }
            header .max-w-7xl { padding-left: .75rem; padding-right: .75rem; }
            header .h-16 { height: 4.25rem; }
            main { padding-bottom: calc(6.25rem + env(safe-area-inset-bottom)) !important; }
            .mobile-bottom-nav {
                display: grid;
                grid-template-columns: repeat(6, minmax(0, 1fr));
                position: fixed;
                z-index: 45;
                inset-inline: 0;
                bottom: 0;
                padding: .45rem .25rem calc(.45rem + env(safe-area-inset-bottom));
                background: rgba(255,255,255,.96);
                border-top: 1px solid #e2e8f0;
                box-shadow: 0 -8px 24px rgba(15,23,42,.08);

            }
            .dark .mobile-bottom-nav { background: rgba(16,27,45,.97); border-color: #263449; }
            .mobile-bottom-nav button {
                min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
                gap: .25rem; padding: .45rem .1rem; border-radius: .7rem; font-size: .62rem; line-height: 1.2;
                color: #64748b; white-space: normal; overflow-wrap: anywhere;
            }
            .mobile-bottom-nav button i { font-size: 1rem; }
            .mobile-bottom-nav button.active { color: #0d9488; background: #f0fdfa; font-weight: 700; }
            .dark .mobile-bottom-nav button.active { background: rgba(13,148,136,.16); color: #5eead4; }
        }
        @media (max-width: 640px) {
            main { padding-left: .85rem !important; padding-right: .85rem !important; }
            main .rounded-3xl { border-radius: 1.25rem; }
            main section[class*="grid"] { gap: .85rem; }
            main h1 { font-size: clamp(1.7rem, 7vw, 2.35rem); line-height: 1.25; }
            main h2 { line-height: 1.35; }
            main .p-8 { padding: 1.15rem; }
            main .sm\:p-12 { padding: 1.15rem; }
            main .text-3xl { font-size: 1.6rem; }
            main .overflow-x-auto { -webkit-overflow-scrolling: touch; }
            .mobile-bottom-nav button { font-size: .58rem; }
            header .w-10 { width: 2.35rem; height: 2.35rem; flex-shrink: 0; }
            header .text-xl { font-size: 1.05rem; }
            header .flex.items-center.space-x-3 { gap: .35rem; }
            header button { min-height: 2.5rem; }
            .fixed.inset-0 > div { max-height: calc(100dvh - 2rem); overflow-y: auto; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; }
        }

    </style>

            const [heartRate, setHeartRate] = useState(74);
            const [spo2, setSpo2] = useState(98);
            const [temp, setTemp] = useState(36.8);

            const t = new Proxy(translations[lang] || translations.ar, {

                    const value = target[key];
                    if (value !== undefined) return value;
                    return translations.ar[key] !== undefined ? translations.ar[key] : String(key);
                }
            });

                const root = document.documentElement;
                if (isDark) {
                    root.classList.add('dark');
                } else {
                    root.classList.remove('dark');
                }
            }, [isDark]);

                document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
                document.documentElement.lang = lang;
            }, [lang]);

            useEffect(() => {
                if (!isStreaming) return;
                const interval = setInterval(() => {
                    setHeartRate(prev => Math.floor(70 + Math.random() * 10 - 4));
                    setSpo2(prev => Math.min(100, Math.max(94, Math.floor(97 + Math.random() * 3))));
                    setTemp(prev => parseFloat((36.6 + Math.random() * 0.4).toFixed(1)));
                }, 1500);
                return () => clearInterval(interval);
            }, [isStreaming]);

                e.preventDefault();
                if (!aiInput.trim()) return;

                const userMsg = { sender: 'user', textAr: aiInput, textEn: aiInput };

                    setAiMessages(prev => [...prev, { sender: 'bot', textAr: botReply, textEn: botReply }]);
                }, 800);
            };

            };

                                className={activeTab === item.id ? 'active' : ''}
                                aria-current={activeTab === item.id ? 'page' : undefined}>
                                <i className={`fa-solid ${item.icon}`} aria-hidden="true"></i>
                                <span>{item.label}</span>
                            </button>
                        ))}
                    </nav>

                    {/* MAIN CONTENT ROUTER */}
                    <main className="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">

                        {/* TAB 1: LANDING & ECOSYSTEM OVERVIEW */}
                        {activeTab === 'home' && (
                            <div className="space-y-12">
                                {/* Hero Section */}
                                <section className="relative overflow-hidden rounded-3xl bg-gradient-to-br from-navy-900 via-navy-800 to-teal-900 text-white p-8 sm:p-12 shadow-2xl">
                                    <div className="relative z-10 max-w-3xl space-y-6">
                                        <span className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-teal-500/20 text-teal-300 border border-teal-500/30 text-xs font-medium">
                                            <i className="fa-solid fa-shield-halved"></i> المنظومة الطبية الموحدة المعتمَدة
                                        </span>
                                        <h1 className="text-3xl sm:text-5xl font-extrabold tracking-tight leading-tight">
                                            رعاية صحية متكاملة تبدأ من <span className="text-teal-400">السرير الذكي</span>
                                        </h1>
                                        <p className="text-slate-300 text-base sm:text-lg leading-relaxed">
                                            {t.tagline}
                                        </p>
                                        <div className="flex flex-wrap gap-4 pt-2">
                                            <button 
                                                onClick={() => setActiveTab('smartbed')}
                                                className="px-6 py-3 rounded-xl bg-teal-600 hover:bg-teal-500 text-white font-semibold transition-all shadow-lg shadow-teal-600/30 flex items-center gap-2"
                                            >
                                                <i className="fa-solid fa-desktop"></i> متابعة بث السرير الذكي
                                            </button>
                                            <button 
                                                onClick={() => setActiveTab('search')}
                                                className="px-6 py-3 rounded-xl bg-white/10 hover:bg-white/20 text-white border border-white/20 font-semibold transition-all flex items-center gap-2"
                                            >
                                                <i className="fa-solid fa-stethoscope"></i> حجز كشف طبي
                                            </button>
                                        </div>
                                    </div>
                                </section>

                                {/* Feature Cards Grid */}
                                <section className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                    <div className="p-6 rounded-2xl bg-white dark:bg-navy-900 border border-slate-200 dark:border-slate-800 shadow-sm hover:shadow-md transition-shadow">
                                        <div className="w-12 h-12 rounded-xl bg-teal-100 dark:bg-teal-950 text-teal-600 dark:text-teal-400 flex items-center justify-center text-xl mb-4">
                                            <i className="fa-solid fa-heart-pulse"></i>
                                        </div>
                                        <h3 className="text-lg font-bold mb-2">مراقبة علامات حيوية دقيقة</h3>
                                        <p className="text-slate-600 dark:text-slate-400 text-sm leading-relaxed">
                                            ربط مباشر لمستشعرات AD8232 و MPU6050 لرسم القلب الكهربائي وتتبع تحركات المريض للوقاية من تقرحات الفراش.
                                        </p>
                                    </div>

                                    <div className="p-6 rounded-2xl bg-white dark:bg-navy-900 border border-slate-200 dark:border-slate-800 shadow-sm hover:shadow-md transition-shadow">
                                        <div className="w-12 h-12 rounded-xl bg-blue-100 dark:bg-blue-950 text-refinedBlue flex items-center justify-center text-xl mb-4">
                                            <i className="fa-solid fa-brain"></i>
                                        </div>
                                        <h3 className="text-lg font-bold mb-2">مساعد إكلينيكي بالذكاء الاصطناعي</h3>
                                        <p className="text-slate-600 dark:text-slate-400 text-sm leading-relaxed">
                                            استبيان وتلخيص إكلينيكي مسبق للأعراض لتوفير وقت الطبيب وتحسين دقة التشخيص الأولي.
                                        </p>
                                    </div>

                                    <div className="p-6 rounded-2xl bg-white dark:bg-navy-900 border border-slate-200 dark:border-slate-800 shadow-sm hover:shadow-md transition-shadow">
                                        <div className="w-12 h-12 rounded-xl bg-indigo-100 dark:bg-indigo-950 text-indigo-500 flex items-center justify-center text-xl mb-4">
                                            <i className="fa-solid fa-file-medical"></i>
                                        </div>
                                        <h3 className="text-lg font-bold mb-2">سجل طبي موحد (EHR)</h3>
                                        <p className="text-slate-600 dark:text-slate-400 text-sm leading-relaxed">
                                            حفظ واستعراض التقارير والروشتات الطبية والفحوصات في مكان آمن واحد متاح للمريض وطبيبه المعتمد.
                                        </p>
                                    </div>
                                </section>
                            </div>
                        )}

                        {/* TAB 2: SMART BED MONITORING DASHBOARD */}
                        {activeTab === 'smartbed' && (
                            <div className="space-y-6">
                                {/* Header / Connection Bar */}
                                <div className="p-5 rounded-2xl bg-white dark:bg-navy-900 border border-slate-200 dark:border-slate-800 flex flex-wrap items-center justify-between gap-4">
                                    <div className="flex items-center gap-3">
                                        <span className={`w-3.5 h-3.5 rounded-full ${isStreaming ? 'bg-emerald-500 animate-pulse' : 'bg-rose-500'}`}></span>
                                        <div>
                                            <h2 className="font-bold text-base">{t.deviceStatus}</h2>
                                            <p className="text-xs text-slate-500 dark:text-slate-400">{t.patientName} • {t.roomInfo}</p>
                                        </div>
                                    </div>
                                    <button 
                                        onClick={() => setIsStreaming(!isStreaming)}
                                        className={`px-4 py-2 rounded-xl text-xs font-bold transition-colors ${
                                            isStreaming 
                                            ? 'bg-rose-100 dark:bg-rose-950/60 text-rose-600 dark:text-rose-400 border border-rose-200 dark:border-rose-800' 
                                            : 'bg-emerald-600 text-white'
                                        }`}
                                    >
                                        <i className={`fa-solid ${isStreaming ? 'fa-pause' : 'fa-play'} mr-1 rtl:ml-1`}></i>
                                        {isStreaming ? t.pauseStream : t.resumeStream}
                                    </button>
                                </div>

                                {/* Vital Cards Row */}
                                <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                                    <div className="p-4 rounded-2xl bg-white dark:bg-navy-900 border border-slate-200 dark:border-slate-800">
                                        <span className="text-xs font-medium text-slate-500 dark:text-slate-400">{t.heartRate}</span>
                                        <div className="flex items-baseline justify-between mt-2">
                                            <span className="text-3xl font-extrabold text-rose-600 dark:text-rose-400">{heartRate}</span>
                                            <span className="text-xs font-bold text-slate-400">BPM</span>
                                        </div>
                                    </div>

                                    <div className="p-4 rounded-2xl bg-white dark:bg-navy-900 border border-slate-200 dark:border-slate-800">
                                        <span className="text-xs font-medium text-slate-500 dark:text-slate-400">{t.spo2}</span>
                                        <div className="flex items-baseline justify-between mt-2">
                                            <span className="text-3xl font-extrabold text-teal-600 dark:text-teal-400">{spo2}%</span>
                                            <span className="text-xs font-bold text-slate-400">SpO2</span>
                                        </div>
                                    </div>

                                    <div className="p-4 rounded-2xl bg-white dark:bg-navy-900 border border-slate-200 dark:border-slate-800">
                                        <span className="text-xs font-medium text-slate-500 dark:text-slate-400">{t.bodyTemp}</span>
                                        <div className="flex items-baseline justify-between mt-2">
                                            <span className="text-3xl font-extrabold text-amber-600 dark:text-amber-400">{temp}°C</span>
                                            <span className="text-xs font-bold text-slate-400">Temp</span>
                                        </div>
                                    </div>

                                    <div className="p-4 rounded-2xl bg-white dark:bg-navy-900 border border-slate-200 dark:border-slate-800">
                                        <span className="text-xs font-medium text-slate-500 dark:text-slate-400">{t.posture}</span>
                                        <div className="mt-2 text-sm font-bold text-indigo-600 dark:text-indigo-400 truncate">
                                            {t[posture]}
                                        </div>
                                    </div>
                                </div>

                                {/* ECG Waveform Simulated Canvas */}
                                <div className="p-6 rounded-2xl bg-white dark:bg-navy-900 border border-slate-200 dark:border-slate-800">
                                    <div className="flex items-center justify-between mb-4">
                                        <h3 className="font-bold text-sm text-slate-700 dark:text-slate-200 flex items-center gap-2">
                                            <i className="fa-solid fa-wave-square text-teal-500"></i> {t.ecgLabel}
                                        </h3>
                                        <span className="text-xs font-mono text-teal-600 dark:text-teal-400">25 mm/s • 10 mm/mV</span>
                                    </div>
                                    <EcgCanvas isStreaming={isStreaming} isDark={isDark} />
                                </div>

                                {/* Alerts Panel */}
                                <div className="p-6 rounded-2xl bg-white dark:bg-navy-900 border border-slate-200 dark:border-slate-800">
                                    <h3 className="font-bold text-sm mb-4 flex items-center gap-2 text-rose-600 dark:text-rose-400">
                                        <i className="fa-solid fa-triangle-exclamation"></i> {t.alertsTitle}
                                    </h3>
                                    {alerts.length === 0 ? (
                                        <p className="text-xs text-slate-400">{t.noAlerts}</p>
                                    ) : (
                                        <div className="space-y-3">
                                            {alerts.map(a => (
                                                <div key={a.id} className="p-3 rounded-xl bg-amber-50 dark:bg-amber-950/40 border border-amber-200 dark:border-amber-800 flex items-center justify-between text-xs">
                                                    <div className="flex items-center gap-3">
                                                        <span className="font-mono text-slate-400">{a.time}</span>
                                                        <span className="font-medium text-amber-900 dark:text-amber-200">{lang === 'ar' ? a.textAr : a.textEn}</span>
                                                    </div>
                                                    <button 
                                                        onClick={() => acknowledgeAlert(a.id)}
                                                        className="px-3 py-1 rounded-lg bg-amber-600 text-white font-bold hover:bg-amber-700 transition-colors"
                                                    >
                                                        {t.ackAlert}
                                                    </button>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* TAB 3: PATIENT PORTAL & EHR TIMELINE */}
                        {activeTab === 'patient' && (
                            <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                                {/* EHR Medical Timeline */}
                                <div className="lg:col-span-2 space-y-6">
                                    <div className="flex items-center justify-between">
                                        <h2 className="text-xl font-bold">{t.ehrTitle}</h2>
                                        <button className="px-4 py-2 rounded-xl bg-teal-600 text-white text-xs font-bold hover:bg-teal-500 transition-colors">
                                            <i className="fa-solid fa-plus mr-1 rtl:ml-1"></i> {t.uploadRecord}
                                        </button>
                                    </div>

                                    <div className="space-y-4">
                                        {medicalRecords.map(rec => (
                                            <div key={rec.id} className="p-5 rounded-2xl bg-white dark:bg-navy-900 border border-slate-200 dark:border-slate-800 shadow-sm space-y-2">
                                                <div className="flex items-center justify-between text-xs text-slate-400">
                                                    <span className="font-mono">{rec.date}</span>
                                                    <span className="px-2 py-0.5 rounded-md bg-slate-100 dark:bg-slate-800 font-medium">{rec.type}</span>
                                                </div>
                                                <h4 className="font-bold text-base">{lang === 'ar' ? rec.titleAr : rec.titleEn}</h4>
                                                <p className="text-xs text-slate-500 dark:text-slate-400">{rec.doctor}</p>
                                                <p className="text-sm leading-relaxed text-slate-700 dark:text-slate-300">{lang === 'ar' ? rec.summaryAr : rec.summaryEn}</p>
                                                <div className="pt-2">
                                                    <button 
                                                        onClick={() => setPreviewDoc(rec)}
                                                        className="text-xs font-bold text-teal-600 dark:text-teal-400 hover:underline flex items-center gap-1"
                                                    >
                                                        <i className="fa-solid fa-eye"></i> {t.viewDoc}
                                                    </button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                {/* Embedded AI Pre-Consultation Assistant */}
                                <div className="space-y-4">
                                    <div className="p-5 rounded-2xl bg-white dark:bg-navy-900 border border-slate-200 dark:border-slate-800 flex flex-col h-[500px]">
                                        <div className="border-b border-slate-200 dark:border-slate-800 pb-3 mb-3">
                                            <h3 className="font-bold text-sm flex items-center gap-2 text-teal-600 dark:text-teal-400">
                                                <i className="fa-solid fa-robot"></i> {t.aiTitle}
                                            </h3>
                                            <p className="text-xs text-slate-500 dark:text-slate-400 mt-1">{t.aiSub}</p>
                                        </div>

                                        <div className="flex-1 overflow-y-auto space-y-3 p-2 text-xs">
                                            {aiMessages.map((m, idx) => (
                                                <div key={idx} className={`p-3 rounded-xl max-w-[85%] ${
                                                    m.sender === 'user' 
                                                    ? 'bg-teal-600 text-white ml-auto rtl:mr-auto rtl:ml-0' 
                                                    : 'bg-slate-100 dark:bg-slate-800 text-slate-800 dark:text-slate-200'
                                                }`}>
                                                    {lang === 'ar' ? m.textAr : m.textEn}
                                                </div>
                                            ))}
                                        </div>

                                        <form onSubmit={handleAiSubmit} className="pt-3 border-t border-slate-200 dark:border-slate-800 flex gap-2">
                                            <input 
                                                type="text" 
                                                value={aiInput}
                                                onChange={e => setAiInput(e.target.value)}
                                                placeholder="وصف الأعراض..."
                                                className="flex-1 px-3 py-2 text-xs rounded-xl border border-slate-200 dark:border-slate-700 bg-transparent focus:outline-none focus:border-teal-500"
                                            />
                                            <button type="submit" className="px-4 py-2 bg-teal-600 text-white text-xs font-bold rounded-xl hover:bg-teal-500">
                                                {t.sendMsg}
                                            </button>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* TAB 4: DOCTOR DIRECTORY & BOOKING */}
                        {activeTab === 'search' && (
                            <div className="space-y-6">
                                {/* Search Filter Bar */}
                                <div className="p-4 rounded-2xl bg-white dark:bg-navy-900 border border-slate-200 dark:border-slate-800 flex flex-wrap gap-4">
                                    <input 
                                        type="text"
                                        value={docSearchQuery}
                                        onChange={e => setDocSearchQuery(e.target.value)}
                                        placeholder={t.searchPlaceholder}
                                        className="flex-1 min-w-[240px] px-4 py-2 text-xs rounded-xl border border-slate-200 dark:border-slate-700 bg-transparent focus:outline-none focus:border-teal-500"
                                    />
                                    <select 
                                        value={selectedGov}
                                        onChange={e => setSelectedGov(e.target.value)}
                                        className="px-4 py-2 text-xs rounded-xl border border-slate-200 dark:border-slate-700 bg-transparent focus:outline-none focus:border-teal-500 dark:bg-navy-900"
                                    >
                                        <option value="all">{t.allGovs}</option>
                                        <option value="mansoura">{t.mansoura}</option>
                                        <option value="cairo">{t.cairo}</option>
                                    </select>
                                </div>

                                {/* Doctors List */}
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    {initialDoctors
                                        .filter(d => selectedGov === 'all' || d.gov === selectedGov)
                                        .map(doc => (
                                            <div key={doc.id} className="p-6 rounded-2xl bg-white dark:bg-navy-900 border border-slate-200 dark:border-slate-800 shadow-sm flex flex-col justify-between space-y-4">
                                                <div className="flex items-start justify-between">
                                                    <div>
                                                        <h3 className="font-bold text-lg flex items-center gap-2">
                                                            {lang === 'ar' ? doc.nameAr : doc.nameEn}
                                                            {doc.verified && <i className="fa-solid fa-circle-check text-teal-500 text-sm"></i>}
                                                        </h3>
                                                        <p className="text-xs text-teal-600 dark:text-teal-400 font-medium mt-1">{lang === 'ar' ? doc.specialtyAr : doc.specialtyEn}</p>
                                                        <p className="text-xs text-slate-400 mt-1"><i className="fa-solid fa-location-dot mr-1 rtl:ml-1"></i>{lang === 'ar' ? doc.cityAr : doc.cityEn}</p>
                                                    </div>
                                                    <span className="px-3 py-1 rounded-xl bg-amber-50 dark:bg-amber-950 text-amber-600 text-xs font-bold">
                                                        ★ {doc.rating}
                                                    </span>
                                                </div>

                                                <div className="flex items-center justify-between border-t border-slate-100 dark:border-slate-800 pt-4">
                                                    <div>
                                                        <span className="text-xs text-slate-400">{t.fee}</span>
                                                        <p className="text-base font-extrabold">{doc.fee} {t.egp}</p>
                                                    </div>
                                                    <button 
                                                        onClick={() => setSelectedDocForBooking(doc)}
                                                        className="px-4 py-2 rounded-xl bg-teal-600 text-white text-xs font-bold hover:bg-teal-500 transition-colors"
                                                    >
                                                        {t.bookNow}
                                                    </button>
                                                </div>
                                            </div>
                                        ))
                                    }
                                </div>
                            </div>
                        )}

                        {/* TAB 5: DOCTOR WORKSPACE */}
                        {activeTab === 'doctor' && (
                            <div className="space-y-6">
                                <h2 className="text-xl font-bold">{t.todayQueue}</h2>
                                <div className="p-6 rounded-2xl bg-white dark:bg-navy-900 border border-slate-200 dark:border-slate-800 space-y-4">
                                    <div className="flex items-center justify-between border-b border-slate-100 dark:border-slate-800 pb-4">
                                        <div>
                                            <h4 className="font-bold text-base">أحمد محمد العوضي (غرفة 302)</h4>
                                            <p className="text-xs text-slate-400">تاريخ الميلاد: 1984/05/12 • كشف متابعة سرير ذكي</p>
                                        </div>
                                        <span className="px-3 py-1 rounded-full bg-teal-100 dark:bg-teal-950 text-teal-600 dark:text-teal-400 text-xs font-bold">
                                            علامات حيوية مستقرة
                                        </span>
                                    </div>

                                    <div className="space-y-3">
                                        <label className="block text-xs font-bold text-slate-500">{t.diagnosis}</label>
                                        <textarea 
                                            rows="2"
                                            placeholder="أدخل التشخيص الطبي..."
                                            className="w-full p-3 text-xs rounded-xl border border-slate-200 dark:border-slate-700 bg-transparent focus:outline-none focus:border-teal-500"
                                        ></textarea>

                                        <label className="block text-xs font-bold text-slate-500">{t.prescription}</label>
                                        <textarea 
                                            rows="3"
                                            placeholder="أدخل العلاج والجرعات..."
                                            className="w-full p-3 text-xs rounded-xl border border-slate-200 dark:border-slate-700 bg-transparent focus:outline-none focus:border-teal-500"
                                        ></textarea>

                                        <button className="px-5 py-2.5 rounded-xl bg-teal-600 text-white text-xs font-bold hover:bg-teal-500 transition-colors">
                                            {t.saveVisit}
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* TAB 6: ADMIN DASHBOARD */}
                        {activeTab === 'admin' && (
                            <div className="space-y-6">
                                <h2 className="text-xl font-bold">{t.navAdmin}</h2>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                    <div className="p-5 rounded-2xl bg-white dark:bg-navy-900 border border-slate-200 dark:border-slate-800">
                                        <span className="text-xs text-slate-400">الأسرة الذكية المتصلة</span>
                                        <p className="text-3xl font-extrabold text-teal-500 mt-2">142 / 150</p>
                                    </div>
                                    <div className="p-5 rounded-2xl bg-white dark:bg-navy-900 border border-slate-200 dark:border-slate-800">
                                        <span className="text-xs text-slate-400">الأطباء المعتمدون</span>
                                        <p className="text-3xl font-extrabold text-refinedBlue mt-2">38</p>
                                    </div>
                                    <div className="p-5 rounded-2xl bg-white dark:bg-navy-900 border border-slate-200 dark:border-slate-800">
                                        <span className="text-xs text-slate-400">استشارات اليوم</span>
                                        <p className="text-3xl font-extrabold text-indigo-500 mt-2">89</p>
                                    </div>
                                </div>
                            </div>
                        )}

                    </main>

                    {/* BOOKING MODAL */}
                    {selectedDocForBooking && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-navy-950/80 backdrop-blur-sm">
                            <div className="bg-white dark:bg-navy-900 border border-slate-200 dark:border-slate-800 w-full max-w-md rounded-2xl p-6 space-y-4 shadow-2xl">
                                <div className="flex items-center justify-between border-b border-slate-100 dark:border-slate-800 pb-3">
                                    <h3 className="font-bold text-base">{t.bookNow}</h3>
                                    <button onClick={() => setSelectedDocForBooking(null)} className="text-slate-400 hover:text-slate-600">
                                        <i className="fa-solid fa-xmark text-lg"></i>
                                    </button>
                                </div>

                                <p className="text-xs text-slate-500 leading-relaxed">{t.payDepositNotice}</p>

                                <div className="space-y-2">
                                    <label className="block text-xs font-bold text-slate-400">طريقة الدفع</label>
                                    <div className="grid grid-cols-2 gap-3">
                                        <button className="p-3 rounded-xl border border-teal-500 bg-teal-50 dark:bg-teal-950/40 text-xs font-bold text-teal-600 dark:text-teal-400 flex items-center justify-center gap-2">
                                            <i className="fa-solid fa-mobile-screen"></i> {t.vodafoneCash}
                                        </button>
                                        <button className="p-3 rounded-xl border border-slate-200 dark:border-slate-700 text-xs font-bold flex items-center justify-center gap-2">
                                            <i className="fa-solid fa-receipt"></i> {t.fawry}
                                        </button>
                                    </div>
                                </div>

                                <button 
                                    onClick={() => {
                                        setSelectedDocForBooking(null);
                                        alert(lang === 'ar' ? 'هذه تجربة توضيحية فقط؛ لم يتم تنفيذ دفع أو حجز حقيقي.' : 'Demo only: no real payment or appointment was processed.');
                                    }}
                                    className="w-full py-3 rounded-xl bg-teal-600 text-white font-bold text-xs hover:bg-teal-500 transition-colors shadow-lg shadow-teal-600/20"
                                >
                                    {t.confirmPay} (150 {t.egp})
                                </button>
                            </div>
                        </div>
                    )}

                    {/* DOCUMENT PREVIEW MODAL */}
                    {previewDoc && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-navy-950/80 backdrop-blur-sm">
                            <div className="bg-white dark:bg-navy-900 border border-slate-200 dark:border-slate-800 w-full max-w-lg rounded-2xl p-6 space-y-4 shadow-2xl">
                                <div className="flex items-center justify-between border-b border-slate-100 dark:border-slate-800 pb-3">
                                    <h3 className="font-bold text-base">{lang === 'ar' ? previewDoc.titleAr : previewDoc.titleEn}</h3>
                                    <button onClick={() => setPreviewDoc(null)} className="text-slate-400 hover:text-slate-600">
                                        <i className="fa-solid fa-xmark text-lg"></i>
                                    </button>
                                </div>

                                <div className="space-y-2 text-xs">
                                    <p className="text-slate-400">التاريخ: {previewDoc.date}</p>
                                    <p className="text-slate-400">الجهة: {previewDoc.doctor}</p>
                                    <div className="p-4 rounded-xl bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 text-sm leading-relaxed mt-4">
                                        {lang === 'ar' ? previewDoc.summaryAr : previewDoc.summaryEn}
                                    </div>
                                </div>

                                <button 
                                    onClick={() => setPreviewDoc(null)}
                                    className="w-full py-2.5 rounded-xl bg-slate-200 dark:bg-slate-800 font-bold text-xs hover:bg-slate-300 transition-colors"
                                >
                                    {t.close}
                                </button>
                            </div>
                        </div>
                    )}

                    {/* FOOTER */}
                    <footer className="mt-auto border-t border-slate-200 dark:border-slate-800 bg-white dark:bg-navy-900 py-6 text-center text-xs text-slate-500">
                        <div className="max-w-7xl mx-auto px-4">
                            LifeBed Healthcare Platform © 2026 • Unified Medical IoT Ecosystem
                        </div>
                    </footer>

                </div>
            );
        }

        // --- ECG WAVEFORM CANVAS COMPONENT ---
        function EcgCanvas({ isStreaming, isDark }) {
            const canvasRef = useRef(null);

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                let animationId;
                let x = 0;

                const draw = () => {
                    const width = canvas.width;
                    const height = canvas.height;

                    if (x === 0) {
                        ctx.fillStyle = isDark ? '#090f1a' : '#f8fafc';
                        ctx.fillRect(0, 0, width, height);

                        // Grid
                        ctx.strokeStyle = isDark ? 'rgba(13, 148, 136, 0.15)' : 'rgba(13, 148, 136, 0.1)';
                        ctx.lineWidth = 0.5;
                        for (let i = 0; i < width; i += 20) {
                            ctx.beginPath();
                            ctx.moveTo(i, 0);
                            ctx.lineTo(i, height);
                            ctx.stroke();
                        }
                        for (let j = 0; j < height; j += 20) {
                            ctx.beginPath();
                            ctx.moveTo(0, j);
                            ctx.lineTo(width, j);
                            ctx.stroke();
                        }
                    }

                    if (isStreaming) {
                        ctx.fillStyle = isDark ? '#090f1a' : '#f8fafc';
                        ctx.fillRect(x, 0, 8, height);

                        ctx.strokeStyle = '#0D9488';
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.moveTo(x, height / 2);

                        // ECG Peak simulation
                        let y = height / 2;
                        if (x % 80 > 30 && x % 80 < 35) y -= 25;
                        else if (x % 80 >= 35 && x % 80 < 42) y += 50;
                        else if (x % 80 >= 42 && x % 80 < 48) y -= 15;

                        ctx.lineTo(x + 2, y);
                        ctx.stroke();

                        x = (x + 2) % width;
                    }

                    animationId = requestAnimationFrame(draw);
                };

                draw();

                return () => cancelAnimationFrame(animationId);
            }, [isStreaming, isDark]);

            return (
                <canvas 
                    ref={canvasRef} 
                    width={800} 
                    height={160} 
                    className="w-full h-40 rounded-xl border border-slate-200 dark:border-slate-800"
                />
            );
        }

        // --- RENDER APP ---
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
